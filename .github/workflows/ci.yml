name: PRAKALP-DRISHTI CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  backend-verification:
    name: Backend Engines & Content Verification (476/476 Assertions)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies for headless OpenCV
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install opencv-python-headless

      - name: Run verification test harness
        env:
          PYTHONPATH: .
          PRAKALP_HOST: 127.0.0.1
          PRAKALP_PORT: 8000
        run: |
          python tests/verify_features.py

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Verify 100% offline air-gapped production build
        run: |
          cd frontend
          npm run build

  accessibility-audit:
    name: Accessibility & Responsive Audit (WCAG 2.1 AA)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Computes WCAG contrast ratios from the design tokens and audits the JSX for
      # focus visibility, bypass blocks, accessible names and viewport safety. No
      # browser or npm install needed -- it reads the source, so it cannot go stale
      # against a built artefact.
      - name: Run WCAG contrast and structural a11y audit
        env:
          PYTHONPATH: .
        run: |
          python tests/test_a11y_audit.py
